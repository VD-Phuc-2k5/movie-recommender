[project]
name = "movie-recommender-server"
version = "0.1.0"
description = "Reproducible Spark recommendation pipeline and FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "pyspark>=3.5,<4",
  "redis>=5.2,<7",
  "setuptools>=80",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
movie-recommender-api = "server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
